<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerJS 갈틱폰 (GitHub Pages)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: 20px auto; }
    .hidden { display: none; }
    input, button { padding: 10px; margin: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #4CAF50; color: white; border: none; cursor: pointer; }
    button:hover { background: #45a049; }
    canvas { border: 2px solid #333; border-radius: 8px; background: white; cursor: crosshair; touch-action: none; }
    ul { list-style: none; padding: 0; }
    li { background: #eee; margin: 5px 0; padding: 8px; border-radius: 4px; }
    img { border: 1px solid #ddd; border-radius: 4px; }
    .status-msg { color: #d9534f; font-weight: bold; margin-top: 10px; }
    .room-code { font-size: 24px; color: #007bff; letter-spacing: 2px; }
  </style>
</head>
<body>

  <h1>🎨 PeerJS 갈틱폰</h1>

  <!-- 1. 메인 / 로비 화면 -->
  <div id="setupPhase" class="card">
    <h3>프로필 & 방 설정</h3>
    <input type="text" id="nickname" placeholder="닉네임 입력"><br>
    
    <div>
      <input type="text" id="customRoomCode" placeholder="원하는 방 ID (예: 1234)" style="width: 180px;">
      <button onclick="createRoom()">방 만들기 (Host)</button>
    </div>
    
    <hr>
    
    <div>
      <input type="text" id="joinHostId" placeholder="방 ID 입력 (예: 1234)" style="width: 180px;">
      <button onclick="joinRoom()">방 참가하기</button>
    </div>
    
    <div id="statusMsg" class="status-msg"></div>

    <div id="roomInfo" class="hidden">
      <h4>내 방 ID (친구들에게 공유):</h4>
      <p class="room-code"><strong id="myPeerId"></strong></p>
    </div>

    <h4>참가자 목록</h4>
    <ul id="playerList"></ul>
    <button id="startBtn" class="hidden" onclick="startGame()">게임 시작</button>
  </div>

  <!-- 2. 최초 제시어 입력 화면 -->
  <div id="wordPhase" class="card hidden">
    <h3>첫 제시어를 입력하세요!</h3>
    <input type="text" id="firstWord" placeholder="예: 우주복을 입은 고양이">
    <button onclick="submitFirstWord()">제출</button>
  </div>

  <!-- 3. 그림 그리기 화면 -->
  <div id="drawPhase" class="card hidden">
    <h3 id="drawPrompt"></h3>
    <canvas id="canvas" width="350" height="350"></canvas><br>
    <button onclick="clearCanvas()">지우기</button>
    <button onclick="submitCanvas()">그림 제출</button>
  </div>

  <!-- 4. 제시어 맞히기 화면 -->
  <div id="guessPhase" class="card hidden">
    <h3>이 그림을 보고 제시어를 맞춰보세요!</h3>
    <img id="guessImage" width="300" height="300"><br>
    <input type="text" id="guessInput" placeholder="추측한 제시어">
    <button onclick="submitGuess()">제출</button>
  </div>

  <!-- 5. 결과 확인 화면 -->
  <div id="resultPhase" class="card hidden">
    <h2>🎉 게임 결과</h2>
    <div id="results"></div>
  </div>

  <script>
    let peer = null;
    let connections = {}; // Host용 클라이언트 연결
    let hostConn = null;  // Client용 방장 연결
    
    let isHost = false;
    let myId = '';
    let myNickname = '';
    
    let players = [];
    let gameData = [];
    let currentRound = 0;
    
    // Canvas 로직
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', (e) => { startDrawing(e.touches[0]); e.preventDefault(); });
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });

    function startDrawing(e) {
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top);
    }
    function stopDrawing() { isDrawing = false; }
    function draw(e) {
      if (!isDrawing) return;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      ctx.lineTo(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top);
      ctx.stroke();
    }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function setStatus(msg) {
      document.getElementById('statusMsg').innerText = msg;
    }

    function showPhase(phaseId) {
      ['setupPhase', 'wordPhase', 'drawPhase', 'guessPhase', 'resultPhase'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(phaseId).classList.remove('hidden');
    }

    // 접두사를 붙여 중복 방지 (사용자가 입력한 '1234' -> 'gartic-1234'로 생성)
    function formatRoomId(code) {
      return 'gartic-' + code.trim().toLowerCase();
    }

    // 1. 방 만들기 (Host)
    function createRoom() {
      myNickname = document.getElementById('nickname').value.trim() || '방장';
      const customCode = document.getElementById('customRoomCode').value.trim();
      
      if (!customCode) {
        return alert('원하는 방 ID(숫자 또는 문자)를 입력하세요!');
      }

      const fullId = formatRoomId(customCode);
      setStatus('방 생성 중...');
      isHost = true;

      if (peer) peer.destroy();
      peer = new Peer(fullId);

      peer.on('open', (id) => {
        myId = id;
        setStatus('');
        document.getElementById('myPeerId').innerText = customCode;
        document.getElementById('roomInfo').classList.remove('hidden');
        document.getElementById('startBtn').classList.remove('hidden');
        
        players = [{ id: myId, nickname: myNickname }];
        updatePlayerListUI();
      });

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          connections[conn.peer] = conn;
        });

        conn.on('data', (data) => handleHostMessage(conn, data));
        
        conn.on('close', () => {
          players = players.filter(p => p.id !== conn.peer);
          delete connections[conn.peer];
          broadcast({ type: 'UPDATE_PLAYERS', players });
          updatePlayerListUI();
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          setStatus('❌ 이미 사용 중인 방 ID입니다. 다른 ID를 입력하세요.');
        } else {
          setStatus('❌ 오류 발생: ' + err.message);
        }
      });
    }

    // 2. 방 참가하기 (Client)
    function joinRoom() {
      myNickname = document.getElementById('nickname').value.trim() || '게스트';
      const inputCode = document.getElementById('joinHostId').value.trim();
      
      if (!inputCode) return alert('접속할 방 ID를 입력하세요.');

      const targetHostId = formatRoomId(inputCode);
      setStatus('방에 연결 중...');
      isHost = false;

      if (peer) peer.destroy();
      peer = new Peer();

      peer.on('open', (id) => {
        myId = id;
        hostConn = peer.connect(targetHostId, { reliable: true });

        hostConn.on('open', () => {
          setStatus('연결 성공! 대기 중...');
          hostConn.send({ type: 'JOIN', nickname: myNickname });
        });

        hostConn.on('data', (data) => handleClientMessage(data));

        hostConn.on('close', () => {
          setStatus('❌ 방장과의 연결이 끊어졌습니다.');
        });
      });

      peer.on('error', (err) => {
        setStatus('❌ 방을 찾을 수 없거나 연결 실패했습니다.');
      });
    }

    // --- Host 메시지 처리 ---
    function handleHostMessage(conn, data) {
      if (data.type === 'JOIN') {
        players.push({ id: conn.peer, nickname: data.nickname });
        broadcast({ type: 'UPDATE_PLAYERS', players });
        updatePlayerListUI();
      } 
      else if (data.type === 'SUBMIT_FIRST_WORD') {
        const pIndex = players.findIndex(p => p.id === conn.peer);
        if (pIndex !== -1) {
          gameData[pIndex].history.push({ type: 'text', content: data.word, author: players[pIndex].nickname });
          checkFirstRoundComplete();
        }
      }
      else if (data.type === 'SUBMIT_TURN_DATA') {
        const pIndex = players.findIndex(p => p.id === conn.peer);
        if (pIndex !== -1) {
          const targetChainIndex = (pIndex + currentRound) % players.length;
          gameData[targetChainIndex].history.push({
            type: data.dataType,
            content: data.content,
            author: players[pIndex].nickname
          });
          checkTurnComplete();
        }
      }
    }

    // --- Client 메시지 처리 ---
    function handleClientMessage(data) {
      if (data.type === 'UPDATE_PLAYERS') {
        players = data.players;
        updatePlayerListUI();
      } else if (data.type === 'START_WORD_PHASE') {
        showPhase('wordPhase');
      } else if (data.type === 'START_DRAW_PHASE') {
        document.getElementById('drawPrompt').innerText = `제시어: ${data.prompt}`;
        showPhase('drawPhase');
      } else if (data.type === 'START_GUESS_PHASE') {
        document.getElementById('guessImage').src = data.imgData;
        showPhase('guessPhase');
      } else if (data.type === 'SHOW_RESULTS') {
        renderResults(data.gameData);
      }
    }

    function broadcast(data) {
      Object.values(connections).forEach(conn => conn.send(data));
    }

    function updatePlayerListUI() {
      document.getElementById('playerList').innerHTML = players.map(p => `<li>${p.nickname}</li>`).join('');
    }

    // --- 게임 진행 흐름 ---
    function startGame() {
      if (players.length < 2) return alert('최소 2명 이상 필요합니다!');
      currentRound = 0;
      gameData = players.map(p => ({ owner: p.nickname, history: [] }));
      
      broadcast({ type: 'START_WORD_PHASE' });
      showPhase('wordPhase');
    }

    function submitFirstWord() {
      const word = document.getElementById('firstWord').value.trim() || '기본 제시어';
      if (isHost) {
        const pIndex = players.findIndex(p => p.id === myId);
        gameData[pIndex].history.push({ type: 'text', content: word, author: myNickname });
        checkFirstRoundComplete();
      } else {
        hostConn.send({ type: 'SUBMIT_FIRST_WORD', word });
      }
      showPhase('setupPhase');
    }

    function checkFirstRoundComplete() {
      const submitted = gameData.filter(g => g.history.length === 1).length;
      if (submitted === players.length) {
        startNextRound();
      }
    }

    function startNextRound() {
      players.forEach((player, index) => {
        const chainIndex = (index + currentRound) % players.length;
        const lastEntry = gameData[chainIndex].history[gameData[chainIndex].history.length - 1];

        const payload = lastEntry.type === 'text' 
          ? { type: 'START_DRAW_PHASE', prompt: lastEntry.content }
          : { type: 'START_GUESS_PHASE', imgData: lastEntry.content };

        if (player.id === myId) {
          handleClientMessage(payload);
        } else if (connections[player.id]) {
          connections[player.id].send(payload);
        }
      });
    }

    function submitCanvas() {
      const dataURL = canvas.toDataURL();
      clearCanvas();
      sendTurnData('image', dataURL);
    }

    function submitGuess() {
      const word = document.getElementById('guessInput').value.trim() || '???';
      document.getElementById('guessInput').value = '';
      sendTurnData('text', word);
    }

    function sendTurnData(dataType, content) {
      if (isHost) {
        const pIndex = players.findIndex(p => p.id === myId);
        const targetChainIndex = (pIndex + currentRound) % players.length;
        gameData[targetChainIndex].history.push({ type: dataType, content, author: myNickname });
        checkTurnComplete();
      } else {
        hostConn.send({ type: 'SUBMIT_TURN_DATA', dataType, content });
      }
      showPhase('setupPhase');
    }

    function checkTurnComplete() {
      const targetLength = currentRound + 2;
      const submitted = gameData.filter(g => g.history.length === targetLength).length;

      if (submitted === players.length) {
        currentRound++;
        if (currentRound >= players.length - 1) {
          const resultPayload = { type: 'SHOW_RESULTS', gameData };
          broadcast(resultPayload);
          renderResults(gameData);
        } else {
          startNextRound();
        }
      }
    }

    function renderResults(data) {
      showPhase('resultPhase');
      const container = document.getElementById('results');
      container.innerHTML = '';

      data.forEach(chain => {
        let html = `<div style="border-top:2px solid #ccc; margin-top:15px; padding-top:10px;"><h4>${chain.owner}의 스케치북</h4>`;
        chain.history.forEach(item => {
          if (item.type === 'text') {
            html += `<p><b>[${item.author}]</b>: ${item.content}</p>`;
          } else {
            html += `<p><b>[${item.author}]</b><br><img src="${item.content}" width="180"></p>`;
          }
        });
        html += `</div>`;
        container.innerHTML += html;
      });
    }
  </script>
</body>
</html>
