<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2인용 미니 격투 게임</title>
  <style>
    body {
      background: #222;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; }
    p { color: #aaa; margin-top: 0; }
    #gameContainer {
      position: relative;
      width: 800px;
      height: 400px;
      margin: 20px auto;
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    canvas {
      background: linear-gradient(to bottom, #1d2671, #c33764);
    }
    .controls-guide {
      display: flex;
      justify-content: space-around;
      max-width: 800px;
      margin: 0 auto;
      background: #333;
      padding: 15px;
      border-radius: 8px;
    }
    .player-guide {
      text-align: left;
    }
    .p1-text { color: #4da6ff; }
    .p2-text { color: #ff4d4d; }
    kbd {
      background: #555;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #777;
    }
  </style>
</head>
<body>

  <h1>🥊 2인용 스트리트 파이터</h1>
  <p>한 키보드로 2명이서 신나게 주고받는 타격감 격투 게임!</p>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div class="controls-guide">
    <div class="player-guide">
      <h3 class="p1-text">🔵 1P (파랑 캐릭터)</h3>
      <p>이동/점프: <kbd>A</kbd> <kbd>D</kbd> / <kbd>W</kbd></p>
      <p>펀치: <kbd>F</kbd> | 킥: <kbd>G</kbd></p>
    </div>
    <div class="player-guide">
      <h3 class="p2-text">🔴 2P (빨강 캐릭터)</h3>
      <p>이동/점프: <kbd>←</kbd> <kbd>→</kbd> / <kbd>↑</kbd></p>
      <p>펀치: <kbd>K</kbd> | 킥: <kbd>L</kbd></p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GROUND_Y = 320;
    const GRAVITY = 0.6;

    // 사운드 효과 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playHitSound(isKick) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = isKick ? 'triangle' : 'square';
      osc.frequency.setValueAtTime(isKick ? 120 : 220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // 파티클 (타격 이펙트)
    let particles = [];
    function createHitEffect(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          radius: Math.random() * 4 + 2,
          color,
          life: 1
        });
      }
    }

    // 플레이어 클래스
    class Fighter {
      constructor({ x, color, facing }) {
        this.x = x;
        this.y = GROUND_Y - 80;
        this.width = 40;
        this.height = 80;
        this.vx = 0;
        this.vy = 0;
        this.color = color;
        this.facing = facing; // 'right' or 'left'
        this.isGrounded = false;
        
        // 공격 상태
        this.isAttacking = false;
        this.attackType = null; // 'punch' or 'kick'
        this.attackTimer = 0;
        this.hitCool = false;

        // 히트 피격 애니메이션
        this.isHit = false;
        this.hitTimer = 0;
      }

      update(opponent) {
        // 위치 업데이트
        this.x += this.vx;
        this.y += this.vy;

        // 중력 적용
        if (this.y + this.height < GROUND_Y) {
          this.vy += GRAVITY;
          this.isGrounded = false;
        } else {
          this.y = GROUND_Y - this.height;
          this.vy = 0;
          this.isGrounded = true;
        }

        // 벽 충돌 예방
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

        // 방향 바라보기
        if (!this.isAttacking) {
          this.facing = this.x < opponent.x ? 'right' : 'left';
        }

        // 공격 타이머 관리
        if (this.isAttacking) {
          this.attackTimer--;
          if (this.attackTimer <= 0) {
            this.isAttacking = false;
            this.hitCool = false;
          }
        }

        // 피격 상태 타이머
        if (this.isHit) {
          this.hitTimer--;
          if (this.hitTimer <= 0) this.isHit = false;
        }
      }

      attack(type, opponent) {
        if (this.isAttacking || this.isHit) return;
        this.isAttacking = true;
        this.attackType = type;
        this.attackTimer = 15; // 15프레임 동안 공격 유효

        // 타격 판정 (Hitbox)
        const reach = type === 'kick' ? 55 : 40;
        const attackX = this.facing === 'right' ? this.x + this.width : this.x - reach;
        const attackBox = { x: attackX, y: this.y + 15, width: reach, height: 30 };

        // 상대방 히트박스 점검
        if (
          attackBox.x < opponent.x + opponent.width &&
          attackBox.x + attackBox.width > opponent.x &&
          attackBox.y < opponent.y + opponent.height &&
          attackBox.y + attackBox.height > opponent.y
        ) {
          // 타격 성공!
          opponent.getHit(this.facing);
          const impactX = this.facing === 'right' ? opponent.x : opponent.x + opponent.width;
          createHitEffect(impactX, opponent.y + 30, type === 'kick' ? '#ffeb3b' : '#ffffff');
          playHitSound(type === 'kick');
        }
      }

      getHit(dir) {
        this.isHit = true;
        this.hitTimer = 12;
        // 밀려나기 (Knockback)
        this.vx = dir === 'right' ? 8 : -8;
        setTimeout(() => this.vx = 0, 100);
      }

      draw() {
        ctx.save();
        
        // 피격 시 붉은색 깜빡임 효과
        if (this.isHit) {
          ctx.fillStyle = '#ff3333';
        } else {
          ctx.fillStyle = this.color;
        }

        // 몸통 그리기
        ctx.fillRect(this.x, this.y, this.width, this.height);

        // 눈 방향 표시
        ctx.fillStyle = '#fff';
        const eyeX = this.facing === 'right' ? this.x + 28 : this.x + 4;
        ctx.fillRect(eyeX, this.y + 10, 8, 8);

        // 공격 애니메이션
        if (this.isAttacking) {
          ctx.fillStyle = this.attackType === 'kick' ? '#ffc107' : '#e91e63';
          const armLength = this.attackType === 'kick' ? 45 : 35;
          const attackY = this.attackType === 'kick' ? this.y + 40 : this.y + 20;

          if (this.facing === 'right') {
            ctx.fillRect(this.x + this.width, attackY, armLength, 15);
          } else {
            ctx.fillRect(this.x - armLength, attackY, armLength, 15);
          }
        }

        ctx.restore();
      }
    }

    // 객체 생성
    const player1 = new Fighter({ x: 150, color: '#4da6ff', facing: 'right' });
    const player2 = new Fighter({ x: 610, color: '#ff4d4d', facing: 'left' });

    // 키 입력 처리
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      keys[e.code] = true;

      // 1P 공격
      if (e.key.toLowerCase() === 'f') player1.attack('punch', player2);
      if (e.key.toLowerCase() === 'g') player1.attack('kick', player2);

      // 2P 공격
      if (e.key.toLowerCase() === 'k') player2.attack('punch', player1);
      if (e.key.toLowerCase() === 'l') player2.attack('kick', player1);
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      keys[e.code] = false;
    });

    function handleMovement() {
      // 1P 조작 (A, D, W)
      if (!player1.isHit) {
        if (keys['a']) player1.vx = -4;
        else if (keys['d']) player1.vx = 4;
        else player1.vx = 0;

        if (keys['w'] && player1.isGrounded) {
          player1.vy = -13;
        }
      }

      // 2P 조작 (방향키 ArrowLeft, ArrowRight, ArrowUp)
      if (!player2.isHit) {
        if (keys['ArrowLeft']) player2.vx = -4;
        else if (keys['ArrowRight']) player2.vx = 4;
        else player2.vx = 0;

        if (keys['ArrowUp'] && player2.isGrounded) {
          player2.vy = -13;
        }
      }
    }

    // 메인 루프
    function gameLoop() {
      // 1. 상태 업데이트
      handleMovement();
      player1.update(player2);
      player2.update(player1);

      // 2. 화면 청소
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 3. 바닥선 그리기
      ctx.fillStyle = '#444';
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
      ctx.fillStyle = '#666';
      ctx.fillRect(0, GROUND_Y, canvas.width, 5);

      // 4. 캐릭터 그리기
      player1.draw();
      player2.draw();

      // 5. 파티클 이펙트 그리기
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(gameLoop);
    }

    // 게임 시작
    gameLoop();
  </script>
</body>
</html>
