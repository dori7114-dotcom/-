<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클래스 격투 대전</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
    }
    h1 { margin: 5px 0; font-size: 26px; }
    #gameWrapper {
      position: relative;
      width: 800px;
      height: 450px;
      margin: 10px auto;
      border: 4px solid #fff;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      background: #000;
    }
    /* 셀렉트 및 UI 오버레이 */
    #selectOverlay, #uiOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }
    #selectOverlay {
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .select-box {
      display: flex;
      gap: 30px;
      margin-top: 15px;
    }
    .p-select {
      background: #1e293b;
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid #475569;
      width: 280px;
    }
    .btn-group {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
    }
    .btn-class {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background: #334155;
      color: white;
      transition: 0.2s;
    }
    .btn-class.active {
      background: #38bdf8;
      color: black;
      box-shadow: 0 0 10px #38bdf8;
    }
    #btnStart {
      margin-top: 20px;
      padding: 12px 35px;
      font-size: 20px;
      font-weight: bold;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #btnStart:hover { background: #16a34a; }

    /* HUD */
    #uiOverlay { pointer-events: none; display: none; }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }
    .hp-bar-outer {
      width: 300px;
      height: 22px;
      background: #333;
      border: 2px solid #fff;
      border-radius: 6px;
      overflow: hidden;
    }
    .hp-bar-inner {
      height: 100%;
      width: 100%;
      transition: width 0.1s ease-out;
    }
    #p1Hp { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
    #p2Hp { background: linear-gradient(90deg, #ef4444, #f97316); float: right; }
    
    /* KO 및 재경기 창 */
    #koScreen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }
    #koText {
      font-size: 56px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 20px #dc2626;
      margin-bottom: 10px;
    }
    #btnRestart {
      padding: 10px 25px;
      font-size: 18px;
      font-weight: bold;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    canvas { display: block; }
    .controls-guide {
      display: flex;
      justify-content: space-around;
      max-width: 800px;
      margin: 8px auto;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    kbd { background: #475569; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>⚔️ 클래스 파이터즈 ⚔️</h1>

  <div id="gameWrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <!-- 캐릭터 선택 화면 -->
    <div id="selectOverlay">
      <h2 style="margin:0; color:#facc15;">캐릭터를 선택하세요</h2>
      <div class="select-box">
        <div class="p-select">
          <h3 style="color:#60a5fa; margin:5px 0;">🔵 1P PLAYER</h3>
          <div class="btn-group">
            <button class="btn-class active" onclick="selectClass(1, 'warrior')">🛡️ 전사</button>
            <button class="btn-class" onclick="selectClass(1, 'archer')">🏹 궁수</button>
            <button class="btn-class" onclick="selectClass(1, 'rogue')">🗡️ 도적</button>
          </div>
          <p id="p1Desc" style="font-size:12px; color:#cbd5e1; height:40px; margin-top:10px;">체력이 높고 강력하지만 약간 둔합니다.</p>
        </div>
        <div class="p-select">
          <h3 style="color:#f87171; margin:5px 0;">🔴 2P PLAYER</h3>
          <div class="btn-group">
            <button class="btn-class active" onclick="selectClass(2, 'warrior')">🛡️ 전사</button>
            <button class="btn-class" onclick="selectClass(2, 'archer')">🏹 궁수</button>
            <button class="btn-class" onclick="selectClass(2, 'rogue')">🗡️ 도적</button>
          </div>
          <p id="p2Desc" style="font-size:12px; color:#cbd5e1; height:40px; margin-top:10px;">체력이 높고 강력하지만 약간 둔합니다.</p>
        </div>
      </div>
      <button id="btnStart" onclick="startGame()">게임 시작</button>
    </div>

    <!-- UI 인게임 오버레이 -->
    <div id="uiOverlay">
      <div class="hud">
        <div>
          <div id="p1Name" style="font-weight:bold; color:#60a5fa; font-size:13px; margin-bottom:3px;">1P</div>
          <div class="hp-bar-outer"><div id="p1Hp" class="hp-bar-inner"></div></div>
        </div>
        <div style="font-size: 20px; font-weight: bold; color: #facc15;">VS</div>
        <div>
          <div id="p2Name" style="font-weight:bold; color:#f87171; font-size:13px; margin-bottom:3px; text-align:right;">2P</div>
          <div class="hp-bar-outer"><div id="p2Hp" class="hp-bar-inner"></div></div>
        </div>
      </div>
    </div>

    <!-- KO & 재경기 화면 -->
    <div id="koScreen">
      <div id="koText">K.O!</div>
      <button id="btnRestart" onclick="resetToSelect()">캐릭터 다시 선택하기</button>
    </div>
  </div>

  <div class="controls-guide">
    <div>
      <span style="color:#60a5fa;">🔵 1P</span> | 이동: <kbd>A</kbd><kbd>D</kbd><kbd>W</kbd> | 공격: <kbd>F</kbd> | 스킬: <kbd>G</kbd> | <b style="color:#38bdf8;">도적 대시: <kbd>Shift</kbd></b>
    </div>
    <div>
      <span style="color:#f87171;">🔴 2P</span> | 이동: <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd> | 공격: <kbd>K</kbd> | 스킬: <kbd>L</kbd> | <b style="color:#38bdf8;">도적 대시: <kbd>/</kbd></b>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GROUND_Y = 370;
    const GRAVITY = 0.75;

    // 클래스 정보 정의
    const CLASS_DATA = {
      warrior: { name: '전사', hp: 140, speed: 4.2, color: '#3b82f6', desc: '💪 높은 체력과 강한 공격력! 단, 약간 둔합니다.' },
      archer: { name: '궁수', hp: 85, speed: 5.0, color: '#22c55e', desc: '🏹 화살 원거리 연속 공격! 체력이 낮습니다.' },
      rogue: { name: '도적', hp: 85, speed: 6.8, color: '#a855f7', desc: '⚡ 빠른 이동속도 & 순간 대시 스킬 보유!' }
    };

    let p1Class = 'warrior';
    let p2Class = 'warrior';
    let p1, p2;
    let particles = [];
    let projectiles = [];
    let gameOver = false;
    let gameStarted = false;

    // 사운드 효과
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'shoot') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'dash') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      }
    }

    function selectClass(pNum, className) {
      if (pNum === 1) p1Class = className;
      else p2Class = className;

      const btns = document.querySelectorAll(`.p-select:nth-child(${pNum}) .btn-class`);
      btns.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById(`p${pNum}Desc`).innerText = CLASS_DATA[className].desc;
    }

    class Fighter {
      constructor(x, classType, isP1) {
        const data = CLASS_DATA[classType];
        this.x = x;
        this.y = GROUND_Y - 90;
        this.width = 40;
        this.height = 90;
        this.vx = 0;
        this.vy = 0;
        this.isP1 = isP1;
        this.classType = classType;
        
        this.maxHp = data.hp;
        this.hp = data.hp;
        this.speed = data.speed;
        this.color = data.color;
        this.facing = isP1 ? 'right' : 'left';
        
        this.isGrounded = false;
        this.isAttacking = false;
        this.attackProgress = 0;
        this.attackType = null;
        this.dashCooldown = 0;
        this.isDashing = false;

        this.hpBar = document.getElementById(isP1 ? 'p1Hp' : 'p2Hp');
        this.animTimer = 0;
      }

      update(opponent) {
        this.x += this.vx;
        this.y += this.vy;

        if (this.y + this.height < GROUND_Y) {
          this.vy += GRAVITY;
          this.isGrounded = false;
        } else {
          this.y = GROUND_Y - this.height;
          this.vy = 0;
          this.isGrounded = true;
        }

        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

        if (!this.isAttacking && !gameOver) {
          this.facing = this.x < opponent.x ? 'right' : 'left';
        }

        if (this.isAttacking) {
          this.attackProgress += 0.18;
          if (this.attackProgress >= 1) {
            this.isAttacking = false;
            this.attackProgress = 0;
          }
        }

        if (this.dashCooldown > 0) this.dashCooldown--;
        this.animTimer += 0.08;
      }

      dash() {
        if (this.classType !== 'rogue' || this.dashCooldown > 0 || gameOver) return;
        this.isDashing = true;
        this.dashCooldown = 60; // 쿨타임 1초
        this.vx = this.facing === 'right' ? 22 : -22;
        playSound('dash');
        
        setTimeout(() => { this.isDashing = false; }, 150);
      }

      attack(type, opponent) {
        if (this.isAttacking || gameOver) return;
        this.isAttacking = true;
        this.attackType = type;
        this.attackProgress = 0;

        // 직업별 공격 특성
        if (this.classType === 'archer') {
          // 궁수: 원거리 화살
          const arrowSpeed = type === 'skill' ? 14 : 10;
          const dmg = type === 'skill' ? 12 : 8;
          const spawnX = this.facing === 'right' ? this.x + 45 : this.x - 10;
          projectiles.push({
            x: spawnX, y: this.y + 30,
            vx: this.facing === 'right' ? arrowSpeed : -arrowSpeed,
            damage: dmg, owner: this, color: '#22c55e'
          });
          playSound('shoot');
        } else if (this.classType === 'warrior') {
          // 전사: 강력한 근접 공격
          const reach = type === 'skill' ? 65 : 45;
          const dmg = type === 'skill' ? 22 : 14;
          this.checkMeleeHit(opponent, reach, dmg);
        } else if (this.classType === 'rogue') {
          // 도적: 빠른 연속 근접 공격
          const reach = 40;
          const dmg = type === 'skill' ? 16 : 9;
          this.checkMeleeHit(opponent, reach, dmg);
        }
      }

      checkMeleeHit(opponent, reach, dmg) {
        const attX = this.facing === 'right' ? this.x + 20 : this.x - reach + 20;
        const box = { x: attX, y: this.y + 20, width: reach, height: 40 };

        if (
          box.x < opponent.x + opponent.width &&
          box.x + box.width > opponent.x &&
          box.y < opponent.y + opponent.height &&
          box.y + box.height > opponent.y
        ) {
          opponent.takeDamage(dmg, this.facing);
          playSound('hit');
        }
      }

      takeDamage(amount, dir) {
        if (gameOver) return;
        this.hp = Math.max(0, this.hp - amount);
        this.hpBar.style.width = `${(this.hp / this.maxHp) * 100}%`;
        this.vx = dir === 'right' ? 6 : -6;

        // 파티클 이펙트
        for (let i = 0; i < 12; i++) {
          particles.push({
            x: this.x + 20, y: this.y + 40,
            vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
            radius: Math.random() * 4 + 2, color: '#ef4444', life: 1
          });
        }

        if (this.hp <= 0 && !gameOver) {
          gameOver = true;
          const winnerText = this.isP1 ? '🔴 2P 승리!' : '🔵 1P 승리!';
          document.getElementById('koText').innerText = winnerText;
          document.getElementById('koScreen').style.display = 'flex';
        }
      }

      draw() {
        ctx.save();
        const isR = this.facing === 'right';
        const centerX = this.x + this.width / 2;
        ctx.translate(centerX, this.y);
        if (!isR) ctx.scale(-1, 1);

        ctx.lineWidth = 5;
        ctx.strokeStyle = this.color;
        ctx.fillStyle = this.color;

        const headY = 15 + Math.sin(this.animTimer) * 2;
        
        // 머리 & 직업 아이콘 표시
        ctx.beginPath();
        ctx.arc(0, headY, 12, 0, Math.PI * 2);
        ctx.fill();

        // 몸통
        ctx.beginPath(); ctx.moveTo(0, headY + 12); ctx.lineTo(0, 55); ctx.stroke();

        // 다리
        ctx.beginPath(); ctx.moveTo(0, 55); ctx.lineTo(-10, 95); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 55); ctx.lineTo(10, 95); ctx.stroke();

        // 팔 및 공격 무기 렌더링
        let armX = 12, armY = 35;
        if (this.isAttacking) {
          const ext = Math.sin(this.attackProgress * Math.PI);
          armX = 35 * ext;
        }

        ctx.beginPath(); ctx.moveTo(0, headY + 15); ctx.lineTo(armX, armY); ctx.stroke();

        // 직업별 무기 비주얼
        if (this.classType === 'warrior') {
          ctx.fillStyle = '#94a3b8'; // 대검/망치
          ctx.fillRect(armX, armY - 5, 18, 10);
        } else if (this.classType === 'archer') {
          ctx.strokeStyle = '#eab308'; // 활
          ctx.beginPath(); ctx.arc(armX, armY, 14, -Math.PI / 2, Math.PI / 2); ctx.stroke();
        } else if (this.classType === 'rogue') {
          ctx.fillStyle = '#c084fc'; // 단검
          ctx.fillRect(armX, armY - 2, 14, 4);
        }

        ctx.restore();
      }
    }

    function startGame() {
      p1 = new Fighter(120, p1Class, true);
      p2 = new Fighter(635, p2Class, false);

      document.getElementById('p1Name').innerText = `🔵 1P [${CLASS_DATA[p1Class].name}]`;
      document.getElementById('p2Name').innerText = `🔴 2P [${CLASS_DATA[p2Class].name}]`;
      document.getElementById('p1Hp').style.width = '100%';
      document.getElementById('p2Hp').style.width = '100%';

      document.getElementById('selectOverlay').style.display = 'none';
      document.getElementById('uiOverlay').style.display = 'block';
      document.getElementById('koScreen').style.display = 'none';

      gameOver = false;
      gameStarted = true;
      projectiles = [];
      particles = [];
    }

    function resetToSelect() {
      gameStarted = false;
      document.getElementById('selectOverlay').style.display = 'flex';
      document.getElementById('uiOverlay').style.display = 'none';
      document.getElementById('koScreen').style.display = 'none';
    }

    // 키 조작
    const keys = {};
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      keys[e.code] = true;

      if (gameStarted && !gameOver) {
        // 1P 조작
        if (k === 'f') p1.attack('normal', p2);
        if (k === 'g') p1.attack('skill', p2);
        if (e.key === 'Shift') p1.dash();

        // 2P 조작
        if (k === 'k') p2.attack('normal', p1);
        if (k === 'l') p2.attack('skill', p1);
        if (e.key === '/') p2.dash();
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = false;
      keys[e.code] = false;
    });

    function handleMovement() {
      if (!gameStarted || gameOver) return;

      // 1P 이동
      if (!p1.isDashing) {
        if (keys['a']) p1.vx = -p1.speed;
        else if (keys['d']) p1.vx = p1.speed;
        else p1.vx = 0;
        if (keys['w'] && p1.isGrounded) p1.vy = -14;
      }

      // 2P 이동
      if (!p2.isDashing) {
        if (keys['ArrowLeft']) p2.vx = -p2.speed;
        else if (keys['ArrowRight']) p2.vx = p2.speed;
        else p2.vx = 0;
        if (keys['ArrowUp'] && p2.isGrounded) p2.vy = -14;
      }
    }

    // 루프
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 배경
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#334155'; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(canvas.width, GROUND_Y); ctx.stroke();

      if (gameStarted) {
        handleMovement();
        p1.update(p2);
        p2.update(p1);

        // 투사체 (화살 등) 업데이트
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.x += p.vx;

          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 14, 4);

          const target = p.owner === p1 ? p2 : p1;
          if (
            p.x > target.x && p.x < target.x + target.width &&
            p.y > target.y && p.y < target.y + target.height
          ) {
            target.takeDamage(p.damage, p.vx > 0 ? 'right' : 'left');
            playSound('hit');
            projectiles.splice(i, 1);
          } else if (p.x < 0 || p.x > canvas.width) {
            projectiles.splice(i, 1);
          }
        }

        p1.draw();
        p2.draw();

        // 파티클
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.05;
          if (pt.life <= 0) { particles.splice(i, 1); continue; }
          ctx.fillStyle = pt.color;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2); ctx.fill();
        }
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
